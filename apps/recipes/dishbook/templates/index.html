{% extends "base.html" %}

{% block content %}
<section class="intro">
    <p class="eyebrow">Recipes from people you know</p>
    <h1>Welcome to the Group Cookbook</h1>
    <p class="intro-lede">Browse recipes shared by our community.</p>
    <form class="search-form" action="{% url 'search' %}" method="get" role="search">
        <label class="visually-hidden" for="home-search">Search recipes</label>
        <input id="home-search" type="search" name="q" placeholder="Search recipes">
        <button class="button" type="submit">Search</button>
    </form>
</section>

<section class="section">
    <div class="section-header">
        <h2>Latest recipes</h2>
        <a class="text-link" href="{% url 'search' %}">See all</a>
    </div>
    {% include "recipe-cards-partial.html" %}
</section>
{% endblock %}
